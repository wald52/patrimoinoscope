name: Deploy Patrimoinoscope to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # lundi 06:00 UTC : HATVP publie par semaine
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Download HATVP data
        run: python scripts/download.py
        continue-on-error: true

      - name: Build anonymized data
        run: python scripts/build_data.py

      - name: Verify no nominative leak
        run: |
          echo "Vérif absence noms dans JSON publiés..."
          ! grep -ri "Baptiste\|ABAD\|Philippe" data/*.json || (echo "ERREUR: fuite nominative?" && exit 1)
          # wald52 autorisé uniquement dans og:url/canvas (test), pas de blocage
          echo "Check wald52 (info only):"
          grep -r "wald52" --include="*.html" --include="*.js" index.html site/ || echo "no wald52"
          ls -lh data/*.json
          cat data/kpis.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
